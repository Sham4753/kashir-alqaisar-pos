name: Waiter app quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Unit tests
        run: pnpm test -- --run
      - name: Lint
        run: pnpm lint
      - name: Sensitive-file policy
        shell: bash
        run: |
          set -euo pipefail
          ! find . -path './.git' -prune -o -type f \( -name '.env*' -o -name '*.keystore' -o -name '*.jks' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
