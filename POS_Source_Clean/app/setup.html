<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعداد نسخة المطعم — كاشير القيصر</title><link rel="stylesheet" href="tailwind.css"><style>body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a5f);font-family:Tahoma,Arial}.card{box-shadow:0 24px 70px #0004}</style>    <link rel="stylesheet" href="design-system.css">
    <script defer src="design-system.js"></script>
    <script defer src="currency-manager.js"></script>
</head>
<body class="p-4 flex items-center justify-center"><main class="card w-full max-w-lg bg-white rounded-3xl p-6 sm:p-8"><div class="text-center mb-6"><div class="text-5xl"></div><p class="text-orange-600 font-bold text-sm mt-3">كاشير القيصر — نسخة مستقلة</p><h1 class="text-2xl font-black text-slate-800 mt-1">إعداد مطعم جديد</h1><p class="text-sm text-slate-500 mt-2">تُحفظ البيانات على هذا الكمبيوتر فقط، وتصبح هذه النسخة خاصة بمطعم واحد.</p></div><form id="setupForm" class="space-y-3"><input id="restaurantName" required class="w-full border rounded-xl p-3" placeholder="اسم المطعم"><input id="ownerName" class="w-full border rounded-xl p-3" placeholder="اسم صاحب المطعم (اختياري)"><div class="grid grid-cols-2 gap-3"><input id="phone" class="w-full border rounded-xl p-3" placeholder="رقم الهاتف"><select id="currency" class="w-full border rounded-xl p-3"><option value="SYP">الليرة السورية ل.س</option><option value="USD">الدولار $</option><option value="EUR">اليورو €</option></select></div><input id="address" class="w-full border rounded-xl p-3" placeholder="العنوان (اختياري)"><hr class="my-3"><h2 class="font-bold text-slate-700">حساب المدير الأول</h2><input id="managerUsername" required class="w-full border rounded-xl p-3" placeholder="اسم المستخدم للمدير"><input id="managerPassword" required minlength="8" type="password" class="w-full border rounded-xl p-3" placeholder="كلمة المرور (8 أحرف على الأقل)"><input id="licenseId" class="w-full border rounded-xl p-3" placeholder="رقم الترخيص (اختياري؛ ينشأ تلقائيًا إذا تُرك فارغًا)"><p id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-xl"></p><button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl p-3.5">إنشاء نسخة المطعم وبدء العمل</button></form><p class="text-[11px] text-slate-400 text-center leading-5 mt-5">لا تشارك كلمة مرور المدير. بعد الإعداد يمكن إضافة الموظفين وتعديل الهوية من الإعدادات.</p></main><script>document.getElementById('setupForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('error');err.classList.add('hidden');const p={restaurant_name:restaurantName.value,owner_name:ownerName.value,phone:phone.value,address:address.value,currency:currency.value,manager_username:managerUsername.value,manager_password:managerPassword.value,license_id:licenseId.value};try{const r=await fetch('/api/setup/initialize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const d=await r.json();if(!r.ok||!d.ok){err.textContent=d.error||'تعذر إكمال الإعداد';err.classList.remove('hidden');return}window.location.href='welcome.html'}catch(x){err.textContent='تعذر الاتصال بالخادم المحلي';err.classList.remove('hidden')}});fetch('/api/setup/status').then(r=>r.json()).then(d=>{if(d.setup_completed)location.href='welcome.html'}).catch(()=>{});</script></body></html>
