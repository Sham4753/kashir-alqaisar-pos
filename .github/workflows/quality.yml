name: POS quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-runtime-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements-lock.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find app -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify clean template and sensitive-file policy
        shell: bash
        run: |
          set -euo pipefail
          test -f app/factory_data.json
          grep -q '"setup_completed"[[:space:]]*:[[:space:]]*false' app/factory_data.json
          ! find . -path './.git' -prune -o -type f \( -name '.env*' -o -name 'data.json' -o -name 'data_backup.json' -o -name '*.log' \) -print -quit | grep -q .
