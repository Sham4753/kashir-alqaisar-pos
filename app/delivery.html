<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الدليفري - كاشير قيصر</title><link rel="stylesheet" href="tailwind.css"><script defer src="design-system.js"></script><script defer src="currency-manager.js"></script>  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="palette-v3.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="min-h-screen bg-slate-100"><nav class="q-appbar"><a class="q-appbar-brand" href="index.html"><span class="q-appbar-brand-mark"></span><span>كاشير قيصر</span></a><div class="q-appbar-links"><a class="q-appbar-link" href="index.html">نقطة البيع</a><a class="q-appbar-link active" href="delivery.html">الدليفري</a><a class="q-appbar-link" href="orders_list.html">الطلبات</a><a class="q-appbar-link" href="dashboard.html">لوحة المدير</a></div><span class="q-appbar-status">محلي وآمن</span></nav><main class="mx-auto max-w-6xl p-5"><header class="mb-5 flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-black text-slate-800"> إدارة سائقي الدليفري</h1><p class="mt-1 text-sm text-slate-500">عيّن السائق وحدّث مرحلة التسليم للطلبات المفتوحة</p></div><a href="index.html" class="rounded-lg bg-slate-600 px-4 py-2 text-white">↩ الكاشير قيصر</a></header><section class="mb-5 rounded-2xl bg-white p-5 shadow-sm"><h2 class="mb-3 font-black">إضافة سائق</h2><div class="grid gap-3 md:grid-cols-3"><input id="driverName" class="rounded-lg border px-3 py-2.5" placeholder="اسم السائق"><input id="driverPhone" class="rounded-lg border px-3 py-2.5" placeholder="رقم الهاتف (اختياري)"><button onclick="addDriver()" class="rounded-lg bg-indigo-600 px-4 py-2 font-bold text-white">إضافة السائق</button></div><div id="drivers" class="mt-3 flex flex-wrap gap-2"></div></section><section class="rounded-2xl bg-white p-5 shadow-sm"><div class="mb-4 flex justify-between"><h2 class="font-black">طلبات الدليفري المفتوحة</h2><button onclick="load()" class="rounded-lg border px-3 py-2 text-sm">تحديث</button></div><div id="orders" class="grid gap-3 md:grid-cols-2"></div></section></main><div id="toast" class="fixed bottom-5 left-1/2 hidden -translate-x-1/2 rounded-xl bg-slate-900 px-5 py-3 text-sm text-white"></div><script>
let drivers=[],timer;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function toast(v){const b=document.getElementById('toast');b.textContent=v;b.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>b.classList.add('hidden'),3500)}
async function load(){try{const [dr,or]=await Promise.all([fetch('/api/delivery/drivers'),fetch('/api/delivery/orders')]);drivers=await dr.json();const orders=await or.json();if(!Array.isArray(drivers))throw new Error();document.getElementById('drivers').innerHTML=drivers.length?drivers.map(d=>`<span class="rounded-full bg-indigo-50 px-3 py-1.5 text-sm text-indigo-800">${esc(d.name)}${d.phone?' · '+esc(d.phone):''}</span>`).join(''):'<span class="text-sm text-slate-400">لا يوجد سائقون بعد</span>';document.getElementById('orders').innerHTML=Array.isArray(orders)&&orders.length?orders.map(o=>`<article class="rounded-xl border border-slate-200 p-4"><div class="flex justify-between gap-3"><b>طلب ${esc(o.id)}</b><span class="text-xs text-slate-500">${esc(o.kitchen_status)}</span></div><p class="mt-2 text-sm text-slate-600">${esc(o.customer||'بدون اسم')} · ${esc(o.delivery_status)}</p><div class="mt-3 grid gap-2 sm:grid-cols-2"><select id="driver-${esc(o.id)}" class="rounded-lg border px-2 py-2"><option value="">تعيين سائق</option>${drivers.map(d=>`<option value="${d.id}" ${d.id===o.driver_id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><select id="status-${esc(o.id)}" class="rounded-lg border px-2 py-2"><option value="assigned">تم التعيين</option><option value="out_for_delivery">في الطريق</option><option value="delivered">تم التسليم</option></select></div><button onclick="saveOrder('${esc(o.id)}')" class="mt-2 w-full rounded-lg bg-emerald-600 py-2 font-bold text-white">حفظ حالة التوصيل</button></article>`).join(''):'<div class="rounded-xl bg-slate-50 p-10 text-center text-slate-400">لا توجد طلبات دليفري مفتوحة</div>'}catch(e){toast('تعذر تحميل الدليفري؛ تأكد من الصلاحية')}}
async function addDriver(){const name=driverName.value.trim(),phone=driverPhone.value.trim();if(!name)return toast('أدخل اسم السائق');const r=await fetch('/api/delivery/drivers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})}),d=await r.json();toast(d.ok?'تمت إضافة السائق':' '+(d.error||'تعذر الحفظ'));if(d.ok){driverName.value='';driverPhone.value='';load()}}
async function saveOrder(id){const driver_id=document.getElementById('driver-'+id).value,status=document.getElementById('status-'+id).value;if(!driver_id)return toast('عيّن سائقًا أولًا');const r=await fetch('/api/delivery/orders/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({driver_id,status})}),d=await r.json();toast(d.ok?'تم تحديث طلب الدليفري':' '+(d.error||'تعذر التحديث'));if(d.ok)load()}
load();setInterval(load,20000);
</script></body></html>
