<main class="max-w-6xl mx-auto p-5"><header class="bg-white rounded-xl shadow p-5 mb-5 text-center"><h1 id="title" class="text-2xl font-bold"> كاشير قيصر</h1></header><div id="menu" class="grid md:grid-cols-3 gap-4"></div></main><script>async function load(){const d=await (await fetch('/api/qr/menu')).json();document.getElementById('title').textContent=' '+(d.restaurant.name||'كاشير قيصر');document.getElementById('menu').innerHTML=Object.entries(d.menu||{}).map(([c,items])=>`<section class="md:col-span-1"><h2 class="font-bold text-lg mb-2"> ${c}</h2>${items.map(p=>`<article class="bg-white rounded-xl shadow p-3 mb-2 flex gap-3">${p.image?`<img src="${p.image}" alt="${String(p.name||'صورة المنتج').replace(/"/g,'&quot;')}" class="w-16 h-16 rounded-lg object-cover">`:''}<div><b>${p.name}</b><div class="text-orange-600 font-bold mt-1">${Number(p.price||0).toLocaleString('ar')} ل.س</div><div class="text-xs text-gray-400">${p.combo_items&&p.combo_items.length?'وجبة مركبة':''}</div></div></article>`).join('')}</section>`).join('')}</script></body></html>
