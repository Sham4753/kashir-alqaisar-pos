<main class="max-w-6xl mx-auto p-5"><header class="flex justify-between items-center mb-5"><div><h1 class="text-2xl font-bold">⚙️ مركز إدارة المدير</h1><p class="text-sm text-gray-500">العروض، الإضافات، بطاقات الهدايا، وإغلاق الوردية</p></div><a href="index.html" class="bg-gray-600 text-white px-4 py-2 rounded-lg">↩️ الكاشير</a></header><div class="grid md:grid-cols-2 gap-5"><section class="bg-white rounded-xl shadow p-5"><h2 class="font-bold mb-3">🎁 إضافة عرض</h2><input id="offerName" class="w-full border rounded-lg p-2 mb-2" placeholder="اسم العرض"><div class="flex gap-2"><select id="offerType" class="flex-1 border rounded-lg p-2"><option value="percent">نسبة مئوية</option><option value="fixed">مبلغ ثابت</option></select><input id="offerValue" type="number" class="w-32 border rounded-lg p-2" placeholder="القيمة"></div><button onclick="addOffer()" class="w-full bg-indigo-600 text-white rounded-lg py-2 mt-3">حفظ العرض</button><div id="offers" class="mt-3 space-y-2"></div></section><section class="bg-white rounded-xl shadow p-5"><h2 class="font-bold mb-3">➕ إضافة موديفاير</h2><input id="modName" class="w-full border rounded-lg p-2 mb-2" placeholder="مثال: الإضافات"><input id="modOptions" class="w-full border rounded-lg p-2" placeholder="خيارات مفصولة بفاصلة"><button onclick="addModifier()" class="w-full bg-purple-600 text-white rounded-lg py-2 mt-3">حفظ الإضافة</button><div id="modifiers" class="mt-3 space-y-2"></div></section><section class="bg-white rounded-xl shadow p-5"><h2 class="font-bold mb-3">🎫 بطاقة هدية</h2><input id="giftCode" class="w-full border rounded-lg p-2 mb-2" placeholder="رمز البطاقة"><input id="giftBalance" type="number" class="w-full border rounded-lg p-2" placeholder="الرصيد"><button onclick="addGift()" class="w-full bg-emerald-600 text-white rounded-lg py-2 mt-3">إصدار بطاقة</button><div id="gifts" class="mt-3 space-y-2"></div></section><section class="bg-white rounded-xl shadow p-5"><h2 class="font-bold mb-3">🔒 إغلاق الوردية</h2><div id="shift" class="bg-gray-50 rounded-lg p-3 text-sm mb-3">جار التحميل...</div><input id="actualCash" type="number" class="w-full border rounded-lg p-2 mb-2" placeholder="النقد الفعلي في الدرج"><input id="shiftReason" class="w-full border rounded-lg p-2" placeholder="سبب الفرق (اختياري)"><button onclick="closeShift()" class="w-full bg-gray-800 text-white rounded-lg py-2 mt-3">حفظ وإغلاق الوردية</button></section></div></main><script>
async function api(path,body){const r=await fetch(path,body&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return [r,r.json()]}
async function load(){let r=await fetch('/api/offers');let x=await r.json();document.getElementById('offers').innerHTML=x.map(o=>`<div class="border rounded p-2 text-sm">${o.name} — ${o.value}${o.type==='percent'?'%':' ل.س'}</div>`).join('')||'<span class="text-gray-400">لا توجد عروض</span>';r=await fetch('/api/modifiers');x=await r.json();document.getElementById('modifiers').innerHTML=x.map(m=>`<div class="border rounded p-2 text-sm">${m.name}: ${(m.options||[]).map(a=>a.name||a).join('، ')}</div>`).join('')||'<span class="text-gray-400">لا توجد إضافات</span>';r=await fetch('/api/gift-cards');x=await r.json();document.getElementById('gifts').innerHTML=x.map(c=>`<div class="border rounded p-2 text-sm">${c.code} — ${c.balance} ل.س</div>`).join('')||'<span class="text-gray-400">لا توجد بطاقات</span>';r=await fetch('/api/shifts/current');x=await r.json();document.getElementById('shift').textContent=`الفواتير: ${x.orders} | المبيعات: ${x.sales} | النقد المتوقع: ${x.cash} | البطاقة: ${x.card}`}
async function addOffer(){const [r,d]=await api('/api/offers',{name:offerName.value,type:offerType.value,value:Number(offerValue.value)});if(!d.ok)return alert(d.error);offerName.value='';offerValue.value='';load()}
async function addModifier(){const [r,d]=await api('/api/modifiers',{name:modName.value,options:modOptions.value.split(',').map(x=>({name:x.trim(),price:0})).filter(x=>x.name)});if(!d.ok)return alert(d.error);modName.value='';modOptions.value='';load()}
async function addGift(){const [r,d]=await api('/api/gift-cards',{code:giftCode.value,balance:Number(giftBalance.value)});if(!d.ok)return alert(d.error);giftCode.value='';giftBalance.value='';load()}
async function closeShift(){const actual=Number(actualCash.value);if(!Number.isFinite(actual)||actual<0)return alert('أدخل النقد الفعلي');const [r,d]=await api('/api/shifts/close',{actual_cash:actual,reason:shiftReason.value});alert(d.ok?'تم إغلاق الوردية':'❌ '+d.error);if(d.ok)load()}
load();setInterval(load,15000);
</script></body></html>
