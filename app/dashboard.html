<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المدير اليومية - كاشير قيصر</title><link rel="stylesheet" href="tailwind.css"><script defer src="design-system.js"></script><script defer src="currency-manager.js"></script>  <link rel="stylesheet" href="design-system.css?v=20261031-orange-v2">
  <link rel="stylesheet" href="palette-v3.css?v=20261031-orange-v2">
  <link rel="stylesheet" href="theme.css?v=20261031-orange-v2">
</head>
<body class="min-h-screen bg-slate-100"><nav class="q-appbar"><a class="q-appbar-brand" href="index.html"><span class="q-appbar-brand-mark">▥</span><span>كاشير قيصر</span></a><div class="q-appbar-links"><a class="q-appbar-link" href="index.html">نقطة البيع</a><a class="q-appbar-link active" href="dashboard.html">لوحة المدير</a><a class="q-appbar-link" href="analytics.html">التقارير</a><a class="q-appbar-link" href="attendance.html">الدوام</a></div><span class="q-appbar-status">محلي وآمن</span></nav><main class="mx-auto max-w-7xl p-5"><header class="mb-6 flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-black text-slate-800"> لوحة المدير اليومية</h1><p id="date" class="mt-1 text-sm text-slate-500">جارِ التحميل…</p></div><button onclick="load()" class="rounded-lg bg-indigo-600 px-4 py-2 font-bold text-white"> تحديث</button></header><section id="kpis" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></section><section class="mt-5 grid gap-5 lg:grid-cols-3"><article class="rounded-2xl bg-white p-5 shadow-sm"><h2 class="font-black text-slate-800">تنبيهات فورية</h2><div id="alerts" class="mt-3 space-y-2 text-sm"></div></article><article class="rounded-2xl bg-white p-5 shadow-sm"><h2 class="font-black text-slate-800">المخزون عند الحد الأدنى</h2><div id="stock" class="mt-3 space-y-2 text-sm"></div></article><article class="rounded-2xl bg-white p-5 shadow-sm"><h2 class="font-black text-slate-800">متوسط التحضير حسب المحطة</h2><div id="prep" class="mt-3 space-y-2 text-sm"></div></article></section></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
	const money=v=>window.CAESARCurrency?window.CAESARCurrency.money(v):Number(v||0).toLocaleString('ar-SY')+' ل.س';
function card(label,value,tone){return `<article class="rounded-2xl border border-${tone}-100 bg-white p-5 shadow-sm"><div class="text-sm font-bold text-slate-500">${label}</div><div class="mt-2 text-2xl font-black text-${tone}-700">${value}</div></article>`}
async function load(){try{const r=await fetch('/api/dashboard/daily',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error);date.textContent='ملخص التشغيل ليوم '+d.date;kpis.innerHTML=[card('مبيعات اليوم',money(d.sales),'emerald'),card('عدد الفواتير',d.orders,'indigo'),card('متوسط الفاتورة',money(d.average_ticket),'violet'),card('موظفون على الدوام',d.staff_present,'amber'),card('طلبات مطبخ مفتوحة',d.kitchen_active,'orange'),card('طلبات جاهزة',d.kitchen_ready,'emerald'),card('دليفري مفتوح',d.delivery_open,'sky'),card('أخطاء طباعة',d.print_errors,'rose')].join('');const alerts=[d.print_errors&&` ${d.print_errors} خطأ طباعة يحتاج مراجعة`,d.kitchen_active&&` ${d.kitchen_active} طلب قيد المطبخ`,d.delivery_open&&` ${d.delivery_open} طلب دليفري مفتوح`].filter(Boolean);document.getElementById('alerts').innerHTML=alerts.length?alerts.map(v=>`<div class="rounded-lg bg-slate-50 p-3">${v}</div>`).join(''):'<p class="rounded-lg bg-emerald-50 p-3 text-emerald-700">لا توجد تنبيهات تشغيلية الآن</p>';document.getElementById('stock').innerHTML=d.low_stock.length?d.low_stock.map(x=>`<div class="flex justify-between rounded-lg bg-rose-50 p-3 text-rose-800"><b>${esc(x.name)}</b><span>${Number(x.quantity||0)}</span></div>`).join(''):'<p class="rounded-lg bg-emerald-50 p-3 text-emerald-700">لا توجد مواد عند الحد الأدنى</p>';document.getElementById('prep').innerHTML=(d.prep_averages||[]).length?d.prep_averages.map(x=>`<div class="flex items-center justify-between rounded-lg bg-indigo-50 p-3 text-indigo-900"><span><b>${esc(x.label)}</b><small class="mr-2 text-indigo-600">${Number(x.orders||0)} طلب</small></span><b>${Number(x.average_minutes||0)} د</b></div>`).join(''):'<p class="rounded-lg bg-slate-50 p-3 text-slate-500">ستظهر المتوسطات بعد وضع طلب في حالة جاهز.</p>'}catch(e){kpis.innerHTML='<div class="col-span-full rounded-xl bg-rose-50 p-5 text-center text-rose-700">تعذر تحميل اللوحة؛ تتطلب صلاحية المدير أو المشرف.</div>'}}
load();setInterval(load,30000);
</script></body></html>
