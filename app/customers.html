<main class="max-w-6xl mx-auto p-5"><header class="flex justify-between items-center mb-5"><div><h1 class="text-2xl font-bold"> العملاء والولاء</h1><p class="text-sm text-gray-500">سجل العملاء والنقاط والمكافآت</p></div><div class="flex gap-2"><button onclick="addCustomer()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg"> إضافة عميل</button><a href="index.html" class="bg-gray-600 text-white px-4 py-2 rounded-lg">↩ الكاشير قيصر</a></div></header><div id="customersGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div></main>
<script>
function esc(value){return String(value??'').replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));}
function jsArg(value){return JSON.stringify(String(value??''));}

async function loadCustomers(){const r=await fetch('/api/customers');const rows=await r.json();document.getElementById('customersGrid').innerHTML=rows.length?rows.map(c=>`<article class="bg-white rounded-xl shadow p-4"><div class="flex justify-between"><b>${esc(c.name)}</b><span class="text-amber-600 font-bold">⭐ ${c.points||0}</span></div><div class="text-sm text-gray-500 mt-2"> ${esc(c.phone||'بدون هاتف')}</div><button onclick="redeem(${c.id})" class="mt-4 w-full border border-amber-300 text-amber-700 py-2 rounded-lg">استبدال نقاط</button></article>`).join(''):'<div class="col-span-full bg-white rounded-xl p-10 text-center text-gray-400">لا يوجد عملاء بعد</div>'}
async function addCustomer(){const name=prompt('اسم العميل:');if(!name)return;const phone=prompt('رقم الهاتف (اختياري):')||'';await fetch('/api/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})});loadCustomers()}
async function redeem(id){const points=parseInt(prompt('عدد النقاط المراد استبدالها:')||'0');if(!points)return;const r=await fetch('/api/loyalty/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:id,points})});const d=await r.json();alert(d.ok?'تم الاستبدال، المتبقي: '+d.remaining:(d.error||'تعذر الاستبدال'));loadCustomers()}
loadCustomers();
</script></body></html>
