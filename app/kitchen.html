<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>شاشة المطبخ - كاشير قيصر قيصر</title>
  <link rel="stylesheet" href="tailwind.css">
  <script defer src="design-system.js"></script><script defer src="currency-manager.js"></script>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="ux-v2.css">
</head>
<body class="min-h-screen bg-slate-100">
  <nav class="q-appbar" aria-label="التنقل الرئيسي"><a class="q-appbar-brand" href="index.html"><span class="q-appbar-brand-mark"></span><span>كاشير قيصر قيصر</span></a><div class="q-appbar-links"><a class="q-appbar-link" href="index.html">نقطة البيع</a><a class="q-appbar-link active" href="kitchen.html">المطبخ</a><a class="q-appbar-link" href="orders_list.html">الطلبات</a><a class="q-appbar-link" href="analytics.html">التقارير</a></div><span class="q-appbar-status">محلي وآمن</span></nav>
  <main class="mx-auto max-w-7xl p-5">
    <header class="mb-5 flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-black text-slate-800"> شاشة محطات المطبخ</h1><p class="mt-1 text-sm text-slate-500">اختر محطتك لعرض الأصناف الموجهة إليها ومتابعة زمن التحضير</p></div><div class="flex flex-wrap gap-2"><label class="flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-bold text-slate-700">تنبيه التأخير<select id="lateThreshold" onchange="setLateThreshold(this.value)" class="bg-transparent outline-none"><option value="10">10 د</option><option value="20" selected>20 د</option><option value="30">30 د</option><option value="45">45 د</option></select></label><button id="soundToggle" onclick="toggleKitchenSound()" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700"> تفعيل الصوت</button><button id="lateMuteButton" onclick="muteLateAlerts()" class="rounded-lg border border-amber-300 bg-amber-50 px-4 py-2 text-sm font-bold text-amber-800"> كتم التأخير 5 د</button><button onclick="loadKitchen()" class="rounded-lg bg-indigo-600 px-4 py-2 font-bold text-white"> تحديث</button><a href="waiting_screen.html" target="_blank" class="rounded-lg bg-emerald-600 px-4 py-2 font-bold text-white"> شاشة الجاهز</a><a href="index.html" class="rounded-lg bg-slate-600 px-4 py-2 font-bold text-white">↩ الكاشير قيصر</a></div></header>
    <div id="readyAlert" class="mb-5 hidden rounded-2xl border border-emerald-300 bg-emerald-50 p-4 text-emerald-900 shadow-sm" role="status" aria-live="polite"><div class="flex items-center gap-3"><span class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-600 font-black text-white"></span><div><b>طلب جاهز للتقديم</b><p id="readyAlertText" class="mt-1 text-sm">أبلغ طاقم التقديم.</p></div><button onclick="dismissReadyAlert()" class="mr-auto rounded-lg px-2 py-1 text-emerald-700 hover:bg-emerald-100" aria-label="إغلاق">حذف</button></div></div>
    <div id="stationFilters" class="mb-5 flex flex-wrap gap-2" aria-label="تصفية محطة المطبخ"></div>
    <div id="kitchenGrid" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
  </main>
<script>
const labels={held:['مؤجل','bg-slate-200 text-slate-700'],new:['جديد','bg-blue-100 text-blue-800'],preparing:['قيد التحضير','bg-amber-100 text-amber-800'],ready:['جاهز','bg-emerald-100 text-emerald-800']};
let kitchenRows=[],activeStation='all',knownOrderIds=null,knownReadyOrderIds=null,knownLateOrderIds=null,kitchenSoundEnabled=localStorage.getItem('caesarKitchenSound')==='1',kitchenAudioContext=null,lateMutedUntil=Number(localStorage.getItem('caesarKitchenLateMutedUntil')||0),readyAlertTimer=null;
const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const stationNames={main:'المطبخ الرئيسي',grill:'الشواية',drinks:'المشروبات',fryer:'المقالي',dessert:'الحلويات'};
function lateThreshold(){return Number(localStorage.getItem('caesarKitchenLateMinutes')||20)}
function elapsed(timestamp){const diff=Math.max(0,Date.now()-new Date(timestamp||Date.now()).getTime());const mins=Math.floor(diff/60000);return mins<1?'الآن':`${mins} د`}
function setLateThreshold(value){localStorage.setItem('caesarKitchenLateMinutes',String(value));renderKitchen()}
function updateSoundButton(){const button=document.getElementById('soundToggle');button.textContent=kitchenSoundEnabled?' الصوت مفعّل':' تفعيل الصوت';button.className='rounded-lg border px-4 py-2 text-sm font-bold '+(kitchenSoundEnabled?'border-emerald-500 bg-emerald-50 text-emerald-800':'border-slate-300 bg-white text-slate-700')}
function playKitchenTone(){if(!kitchenSoundEnabled)return;try{kitchenAudioContext=kitchenAudioContext||new (window.AudioContext||window.webkitAudioContext)();const osc=kitchenAudioContext.createOscillator(),gain=kitchenAudioContext.createGain();osc.frequency.value=880;gain.gain.setValueAtTime(.0001,kitchenAudioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.12,kitchenAudioContext.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,kitchenAudioContext.currentTime+.32);osc.connect(gain).connect(kitchenAudioContext.destination);osc.start();osc.stop(kitchenAudioContext.currentTime+.34)}catch(e){console.warn('تعذر تشغيل تنبيه المطبخ',e)}}
function toggleKitchenSound(){kitchenSoundEnabled=!kitchenSoundEnabled;localStorage.setItem('caesarKitchenSound',kitchenSoundEnabled?'1':'0');if(kitchenSoundEnabled){try{(kitchenAudioContext||new (window.AudioContext||window.webkitAudioContext)()).resume?.();playKitchenTone()}catch(e){}}updateSoundButton()}
function playReadyTone(){if(!kitchenSoundEnabled)return;try{kitchenAudioContext=kitchenAudioContext||new (window.AudioContext||window.webkitAudioContext)();[1046,1318].forEach((frequency,index)=>{const osc=kitchenAudioContext.createOscillator(),gain=kitchenAudioContext.createGain(),start=kitchenAudioContext.currentTime+index*.15;osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.14,start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+.14);osc.connect(gain).connect(kitchenAudioContext.destination);osc.start(start);osc.stop(start+.16)})}catch(e){console.warn('تعذر تنبيه الجاهزية',e)}}
function playLateTone(){if(!kitchenSoundEnabled||Date.now()<lateMutedUntil)return;try{kitchenAudioContext=kitchenAudioContext||new (window.AudioContext||window.webkitAudioContext)();const osc=kitchenAudioContext.createOscillator(),gain=kitchenAudioContext.createGain();osc.type='square';osc.frequency.value=330;gain.gain.setValueAtTime(.0001,kitchenAudioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.08,kitchenAudioContext.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,kitchenAudioContext.currentTime+.22);osc.connect(gain).connect(kitchenAudioContext.destination);osc.start();osc.stop(kitchenAudioContext.currentTime+.24)}catch(e){console.warn('تعذر تنبيه التأخير',e)}}
function updateLateMuteButton(){const button=document.getElementById('lateMuteButton');const remaining=Math.ceil(Math.max(0,lateMutedUntil-Date.now())/60000);button.textContent=remaining?` كتم التأخير: ${remaining} د`:' كتم التأخير 5 د';button.className='rounded-lg border px-4 py-2 text-sm font-bold '+(remaining?'border-slate-300 bg-slate-100 text-slate-600':'border-amber-300 bg-amber-50 text-amber-800')}
function muteLateAlerts(){lateMutedUntil=Date.now()+5*60000;localStorage.setItem('caesarKitchenLateMutedUntil',String(lateMutedUntil));updateLateMuteButton()}
function showReadyAlert(rows){const alert=document.getElementById('readyAlert');document.getElementById('readyAlertText').textContent='جاهز للتقديم: '+rows.map(row=>'طلب '+row.id).join('، ');alert.classList.remove('hidden');clearTimeout(readyAlertTimer);readyAlertTimer=setTimeout(dismissReadyAlert,12000)}
function dismissReadyAlert(){document.getElementById('readyAlert').classList.add('hidden');clearTimeout(readyAlertTimer)}
function notifyNewOrders(rows){const activeRows=rows.filter(row=>row.kitchen_status!=='held'),ids=new Set(activeRows.map(row=>String(row.id))),readyIds=new Set(activeRows.filter(row=>row.kitchen_status==='ready').map(row=>String(row.id))),lateIds=new Set(activeRows.filter(row=>row.kitchen_status!=='ready'&&Math.floor(Math.max(0,Date.now()-new Date(row.timestamp||row.updated_at||Date.now()).getTime())/60000)>=lateThreshold()).map(row=>String(row.id)));if(knownOrderIds!==null&&[...ids].some(id=>!knownOrderIds.has(id)))playKitchenTone();if(knownReadyOrderIds!==null){const newlyReady=activeRows.filter(row=>row.kitchen_status==='ready'&&!knownReadyOrderIds.has(String(row.id)));if(newlyReady.length){playReadyTone();showReadyAlert(newlyReady)}}if(knownLateOrderIds!==null&&[...lateIds].some(id=>!knownLateOrderIds.has(id)))playLateTone();knownOrderIds=ids;knownReadyOrderIds=readyIds;knownLateOrderIds=lateIds}
function modifierText(modifiers){return (modifiers||[]).map(m=>typeof m==='object'?m.name:m).filter(Boolean).join('، ')}
function renderStationFilters(){const stations=[...new Set(kitchenRows.flatMap(row=>(row.stations||[]).map(s=>s.key)))];const options=[['all','كل المحطات'],...stations.map(key=>[key,stationNames[key]||key])];document.getElementById('stationFilters').innerHTML=options.map(([key,label])=>`<button onclick="setStation('${key}')" class="rounded-full border px-4 py-2 text-sm font-bold ${activeStation===key?'border-indigo-600 bg-indigo-600 text-white':'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'}">${esc(label)}</button>`).join('')}
function setStation(station){activeStation=station;renderKitchen()}
function itemRows(order){const items=activeStation==='all'?(order.items||[]):(order.station_items?.[activeStation]||[]);return items.map(item=>`<div class="rounded-lg bg-slate-50 px-3 py-2"><div class="flex items-center justify-between gap-3"><span class="font-bold text-slate-800">${esc(item.name)}</span><b class="text-indigo-700">× ${Number(item.quantity||item.qty||1)}</b></div>${modifierText(item.modifiers)?`<div class="mt-1 text-xs text-indigo-700">تعديل: ${esc(modifierText(item.modifiers))}</div>`:''}</div>`).join('')}
function renderKitchen(){renderStationFilters();document.getElementById('lateThreshold').value=String(lateThreshold());updateSoundButton();updateLateMuteButton();const rows=activeStation==='all'?kitchenRows:kitchenRows.filter(row=>(row.station_items?.[activeStation]||[]).length);document.getElementById('kitchenGrid').innerHTML=rows.length?rows.map(order=>{const st=order.kitchen_status||'new',label=labels[st]||labels.new;const minutes=Math.floor(Math.max(0,Date.now()-new Date(order.timestamp||order.updated_at||Date.now()).getTime())/60000),late=st!=='held'&&st!=='ready'&&minutes>=lateThreshold();return `<article class="rounded-2xl border ${late?'border-rose-400 bg-rose-50 shadow-rose-100':st==='held'?'border-slate-300 bg-slate-50':'border-slate-200 bg-white'} p-4 shadow-sm"><div class="mb-3 flex items-start justify-between gap-3"><div><b class="text-lg ${late?'text-rose-900':'text-slate-800'}">طلب ${esc(order.id)}</b><div class="mt-1 text-xs ${late?'font-bold text-rose-700':'text-slate-500'}">${esc(order.table||order.type||'سفري')} · منذ ${elapsed(order.timestamp||order.updated_at)}${late?' · متأخر':''}${st==='held'?' · بانتظار الإطلاق':''}</div></div><div class="flex flex-col items-end gap-1"><span class="rounded-full px-2.5 py-1 text-xs font-black ${label[1]}">${label[0]}</span>${late?'<span class="rounded-full bg-rose-600 px-2 py-1 text-[10px] font-black text-white animate-pulse">متأخر</span>':''}</div></div><div class="mb-3 flex flex-wrap gap-1">${(order.stations||[]).map(s=>`<span class="rounded-full bg-indigo-50 px-2 py-1 text-[11px] font-bold text-indigo-700">${esc(s.label)}: ${s.items}</span>`).join('')}</div><div class="mb-4 space-y-2">${itemRows(order)}</div><div class="flex gap-2">${st==='held'?`<button onclick="setStatus('${esc(order.id)}','new')" class="flex-1 rounded-lg bg-indigo-600 py-2 font-bold text-white">إطلاق الطلب الآن</button>`:''}${st==='new'?`<button onclick="setStatus('${esc(order.id)}','preparing')" class="flex-1 rounded-lg bg-amber-500 py-2 font-bold text-white">بدء التحضير</button>`:''}${st==='preparing'?`<button onclick="setStatus('${esc(order.id)}','ready')" class="flex-1 rounded-lg bg-emerald-600 py-2 font-bold text-white">تم التجهيز</button>`:''}${st==='ready'?`<button onclick="setStatus('${esc(order.id)}','served')" class="flex-1 rounded-lg bg-slate-700 py-2 font-bold text-white">تم التسليم</button>`:''}</div></article>`}).join(''):'<div class="col-span-full rounded-2xl bg-white p-12 text-center text-slate-400">لا توجد طلبات معلقة لهذه المحطة</div>'}
async function loadKitchen(){try{const r=await fetch('/api/kitchen/orders');kitchenRows=await r.json();notifyNewOrders(kitchenRows);renderKitchen()}catch(e){document.getElementById('kitchenGrid').innerHTML='<div class="col-span-full rounded-xl bg-rose-50 p-6 text-center text-rose-700">تعذر تحميل طلبات المطبخ</div>'}}
async function setStatus(id,status){await fetch('/api/kitchen/orders/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadKitchen()}
loadKitchen();setInterval(loadKitchen,15000);
</script></body></html>
