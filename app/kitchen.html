<main class="max-w-6xl mx-auto p-5"><header class="flex justify-between items-center mb-5"><div><h1 class="text-2xl font-bold">👨‍🍳 شاشة المطبخ</h1><p class="text-sm text-gray-500">متابعة الطلبات داخل الشبكة المحلية</p></div><div class="flex gap-2"><button onclick="loadKitchen()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">🔄 تحديث</button><a href="index.html" class="bg-gray-600 text-white px-4 py-2 rounded-lg">↩️ الكاشير</a></div></header><div id="kitchenGrid" class="grid md:grid-cols-3 gap-4"></div></main>
<script>
const labels={new:['جديد','bg-blue-100 text-blue-800'],preparing:['قيد التحضير','bg-amber-100 text-amber-800'],ready:['جاهز','bg-emerald-100 text-emerald-800']};
async function loadKitchen(){const r=await fetch('/api/kitchen/orders');const rows=await r.json();document.getElementById('kitchenGrid').innerHTML=rows.length?rows.map(o=>{const st=o.kitchen_status||'new', l=labels[st]||labels.new;return `<article class="bg-white rounded-xl shadow p-4"><div class="flex justify-between mb-3"><b>فاتورة ${o.id}</b><span class="px-2 py-1 rounded text-xs ${l[1]}">${l[0]}</span></div><div class="text-sm space-y-1 mb-4">${(o.items||[]).map(i=>`<div class="flex justify-between"><span>${i.name||''}</span><b>× ${i.quantity||i.qty||1}</b></div>`).join('')}</div><div class="flex gap-2">${st==='new'?`<button onclick="setStatus('${o.id}','preparing')" class="flex-1 bg-amber-500 text-white py-2 rounded-lg">بدء التحضير</button>`:''}${st==='preparing'?`<button onclick="setStatus('${o.id}','ready')" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg">تم التجهيز</button>`:''}${st==='ready'?`<button onclick="setStatus('${o.id}','served')" class="flex-1 bg-gray-700 text-white py-2 rounded-lg">تم التسليم</button>`:''}</div></article>`}).join(''):'<div class="col-span-full bg-white rounded-xl p-10 text-center text-gray-400">لا توجد طلبات معلقة</div>'}
async function setStatus(id,status){await fetch('/api/kitchen/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadKitchen()}loadKitchen();setInterval(loadKitchen,15000);
</script></body></html>
