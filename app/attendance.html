<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دوام الموظفين - كاشير قيصر</title><link rel="stylesheet" href="tailwind.css"><script defer src="design-system.js"></script><script defer src="currency-manager.js"></script>  <link rel="stylesheet" href="design-system.css?v=20261031-orange-v2">
  <link rel="stylesheet" href="palette-v3.css?v=20261031-orange-v2">
  <link rel="stylesheet" href="theme.css?v=20261031-orange-v2">
</head>
<body class="min-h-screen bg-slate-100"><nav class="q-appbar"><a class="q-appbar-brand" href="index.html"><span class="q-appbar-brand-mark">◷</span><span>كاشير قيصر</span></a><div class="q-appbar-links"><a class="q-appbar-link" href="index.html">نقطة البيع</a><a class="q-appbar-link" href="employees.html">الموظفون</a><a class="q-appbar-link active" href="attendance.html">الدوام</a><a class="q-appbar-link" href="dashboard.html">لوحة المدير</a></div><span class="q-appbar-status">محلي وآمن</span></nav><main class="mx-auto max-w-6xl p-5"><header class="mb-5 flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-black text-slate-800">⏱ دوام الموظفين والورديات</h1></div><a href="index.html" class="rounded-lg bg-slate-600 px-4 py-2 text-white">↩ الكاشير قيصر</a></header><section class="mb-5 grid gap-4 rounded-2xl bg-white p-5 shadow-sm md:grid-cols-[1fr_auto_auto]"><select id="employee" class="rounded-lg border border-slate-300 px-3 py-3"><option value="">اختر موظفًا</option></select><button onclick="clock('in')" class="rounded-lg bg-emerald-600 px-5 py-3 font-bold text-white">تسجيل حضور</button><button onclick="clock('out')" class="rounded-lg bg-rose-600 px-5 py-3 font-bold text-white">تسجيل انصراف</button></section><section class="rounded-2xl bg-white p-5 shadow-sm"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><h2 class="font-black text-slate-800">سجل اليوم</h2><button onclick="load()" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">تحديث</button></div><div class="overflow-x-auto"><table class="w-full text-right text-sm"><thead class="border-b text-slate-500"><tr><th class="p-2">الموظف</th><th class="p-2">الحضور</th><th class="p-2">الانصراف</th><th class="p-2">المدة</th><th class="p-2">سجل بواسطة</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="toast" class="fixed bottom-5 left-1/2 hidden -translate-x-1/2 rounded-xl bg-slate-900 px-5 py-3 text-sm text-white shadow-xl"></div><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let timer;
function toast(text){const box=document.getElementById('toast');box.textContent=text;box.classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>box.classList.add('hidden'),3500)}
const time=v=>v?new Date(v).toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'}):'—';
async function load(){try{const [employees,res]=await Promise.all([fetch('/api/employees'),fetch('/api/attendance')]);const emps=await employees.json(),rows=await res.json();document.getElementById('employee').innerHTML='<option value="">اختر موظفًا</option>'+emps.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');document.getElementById('rows').innerHTML=Array.isArray(rows)&&rows.length?rows.map(r=>`<tr class="border-b border-slate-100"><td class="p-2 font-bold">${esc(r.employee_name)}</td><td class="p-2">${time(r.clock_in)}</td><td class="p-2">${time(r.clock_out)}</td><td class="p-2">${r.minutes==null?'قيد الدوام':r.minutes+' دقيقة'}</td><td class="p-2 text-slate-500">${esc(r.recorded_by||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="p-8 text-center text-slate-400">لا توجد سجلات اليوم</td></tr>'}catch(e){toast('تعذر تحميل الدوام؛ تأكد من تسجيل الدخول بصلاحية الكاشير قيصر أو المشرف أو المدير')}}
async function clock(action){const employee_id=Number(document.getElementById('employee').value);if(!employee_id)return toast('اختر موظفًا أولًا');const r=await fetch('/api/attendance/clock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id,action})});const d=await r.json();toast(d.ok?(action==='in'?'تم تسجيل الحضور':'تم تسجيل الانصراف'):' '+(d.error||'تعذرت العملية'));if(d.ok)load()}
load();setInterval(load,30000);
</script></body></html>
