<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات الجاهزة — كاشير قيصر قيصر</title><link rel="stylesheet" href="tailwind.css"><script defer src="design-system.js"></script><script defer src="currency-manager.js"></script>  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="ux-v2.css">
</head>
<body class="min-h-screen bg-slate-950 text-white"><main class="mx-auto max-w-7xl p-6"><header class="mb-8 flex items-center justify-between gap-4"><div><h1 class="text-3xl font-black">طلباتك جاهزة</h1><p class="mt-2 text-slate-300">اعرض هذه الشاشة للزبائن على شاشة منفصلة داخل المطعم</p></div><div class="text-left"><div id="clock" class="text-2xl font-bold"></div><a href="index.html" class="mt-2 inline-block text-sm text-slate-300 underline">لوحة الكاشير قيصر</a></div></header><section id="readyGrid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></section></main><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'})}
function render(rows){document.getElementById('readyGrid').innerHTML=rows.length?rows.map(row=>`<article class="rounded-3xl border border-emerald-400/40 bg-emerald-500/10 p-7 text-center shadow-2xl"><div class="text-sm font-bold text-emerald-300">${esc(row.type)}</div><div class="mt-2 text-5xl font-black tracking-wide">${esc(row.id)}</div>${row.customer?`<div class="mt-4 text-xl text-white">${esc(row.customer)}</div>`:''}${row.driver_name?`<div class="mt-2 text-sm text-slate-300">السائق: ${esc(row.driver_name)}</div>`:''}</article>`).join(''):'<div class="col-span-full rounded-3xl border border-slate-700 bg-slate-900 p-14 text-center text-2xl text-slate-400">لا توجد طلبات جاهزة الآن</div>'}
async function load(){try{const r=await fetch('/api/ready-orders',{cache:'no-store'});render(await r.json())}catch(e){render([])}}tick();load();setInterval(tick,1000);setInterval(load,10000);
</script></body></html>
