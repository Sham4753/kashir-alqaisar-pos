<main class="max-w-5xl mx-auto p-5"><header class="flex justify-between items-center mb-5"><div><h1 class="text-2xl font-bold"> المصروفات اليومية</h1><p class="text-sm text-gray-500">تسجيل المصروفات التشغيلية مع العملة وسعر الصرف</p></div><a href="index.html" class="bg-gray-700 text-white px-4 py-2 rounded-lg">↩ الكاشير قيصر</a></header>
<section class="bg-white rounded-xl shadow p-4 mb-5"><div class="grid md:grid-cols-5 gap-3"><input id="note" class="border rounded-lg p-2" placeholder="وصف المصروف"><input id="amount" type="number" step="0.01" class="border rounded-lg p-2" placeholder="المبلغ"><select id="currency" class="border rounded-lg p-2"><option value="SYP">ل.س</option><option value="USD">$</option><option value="EUR">€</option></select><input id="rate" type="number" step="0.01" class="border rounded-lg p-2" placeholder="سعر الصرف"><select id="category" class="border rounded-lg p-2"><option>عام</option><option>نقل</option><option>غاز وكهرباء</option><option>صيانة</option><option>أجور</option><option>مشتريات</option></select></div><button onclick="addExpense()" class="mt-3 bg-emerald-600 text-white px-5 py-2 rounded-lg font-bold"> حفظ المصروف</button></section>
<section class="bg-white rounded-xl shadow overflow-hidden"><div class="p-4 border-b flex justify-between"><b>السجل</b><b id="total" class="text-red-600"></b></div><div class="overflow-auto"><table class="w-full text-right"><thead class="bg-slate-100"><tr><th class="p-3">التاريخ</th><th class="p-3">الوصف</th><th class="p-3">التصنيف</th><th class="p-3">المبلغ</th><th class="p-3">الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
let rows=[];const sym={SYP:'ل.س',USD:'$',EUR:'€'};
async function load(){const r=await fetch('/api/expenses');rows=(await r.json()).filter(x=>!x.voided&&!x.material_id);render()}
function render(){document.getElementById('rows').innerHTML=rows.filter(x=>!x.voided).length?rows.filter(x=>!x.voided).slice().reverse().map(x=>`<tr class="border-t"><td class="p-3">${(x.date||'').slice(0,16).replace('T',' ')}</td><td class="p-3">${esc(x.note)}</td><td class="p-3">${esc(x.category||'عام')}</td><td class="p-3 font-bold">${Number(x.amount||0).toLocaleString()} ${sym[x.currency]||x.currency}</td><td class="p-3"><button onclick="removeExpense(${x.id})" class="text-red-600">إلغاء</button></td></tr>`).join(''):'<tr><td colspan="5" class="p-8 text-center text-gray-400">لا توجد مصروفات يدوية</td></tr>';document.getElementById('total').textContent='الإجمالي: '+rows.filter(x=>!x.voided).reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString()}
async function addExpense(){const note=document.getElementById('note').value.trim(),amount=Number(document.getElementById('amount').value),currency=document.getElementById('currency').value,exchange_rate=Number(document.getElementById('rate').value)||0,category=document.getElementById('category').value;if(!note||amount<=0)return alert('أدخل الوصف والمبلغ');const r=await fetch('/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note,amount,currency,exchange_rate,category})});const d=await r.json();if(!d.ok)return alert(d.error||'تعذر الحفظ');document.getElementById('note').value='';document.getElementById('amount').value='';load()}
async function removeExpense(id){if(!confirm('إلغاء المصروف؟'))return;await fetch('/api/expenses/'+id,{method:'DELETE'});load()}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
