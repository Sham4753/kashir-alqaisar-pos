<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير القيصر</title>
    <link rel="stylesheet" href="tailwind.css">
    <style>
        body { background: radial-gradient(circle at 50% 0%, #1d4f91 0%, #102b50 33%, #081628 72%); }
        .welcome-identity { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 34px; }
        .welcome-identity-mark, .login-identity-mark { display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(191, 219, 254, .36); background: rgba(255,255,255,.98); box-shadow: 0 12px 30px rgba(3, 18, 38, .25); }
        .welcome-identity-mark { width: 84px; height: 84px; border-radius: 8px; margin-bottom: 16px; }
        .login-identity-mark { width: 54px; height: 54px; border-radius: 8px; margin: 0 auto 10px; }
        .welcome-identity-mark img, .login-identity-mark img { width: 100%; height: 100%; object-fit: contain; }
        .welcome-identity svg, .profile-icon svg { width: 31px; height: 31px; fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .profile-card { min-height: 76px; transition: transform .15s ease, background .15s ease, border-color .15s ease; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.30); border-radius: 8px !important; box-shadow: 0 10px 22px rgba(2, 11, 25, .16); }
        .profile-card:hover { transform: translateY(-2px); background: rgba(255,255,255,.18); border-color: #93c5fd; }
        .profile-card:active { transform: scale(.985); }
        .profile-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; background: #dbeafe; flex: 0 0 auto; }
        .password-dialog { border-radius: 8px !important; border: 1px solid #dbeafe; box-shadow: 0 24px 50px rgba(2, 11, 25, .42); }
    </style>
    <link rel="stylesheet" href="design-system.css">
    <script defer src="design-system.js"></script>
    <script defer src="currency-manager.js"></script>
</head>
<body class="min-h-screen flex flex-col text-white">
    <div class="flex-1 flex flex-col items-center justify-center px-6 py-10">
        <div class="welcome-identity">
            <div class="welcome-identity-mark" data-restaurant-logo aria-label="هوية المطعم"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6M7 4v6M4 7h3M7 4v16M15 4v8a3 3 0 0 0 6 0V4M18 15v5"></path></svg></div>
            <h1 id="restaurantName" data-restaurant-name class="text-3xl font-bold text-white mb-2">كاشير القيصر</h1>
            <p class="text-blue-100 text-sm font-semibold">اختر حسابك للمتابعة</p>
            <div id="dateTime" class="text-blue-200 text-sm mt-2"></div>
        </div>

        <div id="profilesBox" class="w-full max-w-md space-y-3"></div>

        <div id="noUsersBox" class="hidden w-full max-w-md text-center">
            <button onclick="window.location.href='index.html'" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg text-lg shadow-xl transition">
                دخول للنظام
            </button>
            <p class="text-blue-200 text-xs mt-3">تقدر تضيف مستخدمين (مدير/كاشير) لاحقاً من الإعدادات</p>
        </div>
    </div>

    <!-- نافذة كلمة المرور -->
    <div id="pwModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 px-6">
        <div class="password-dialog bg-white shadow-2xl p-6 w-full max-w-xs text-center text-gray-800">
            <div class="login-identity-mark" data-restaurant-logo aria-label="شعار المطعم"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6M7 4v6M4 7h3M7 4v16M15 4v8a3 3 0 0 0 6 0V4M18 15v5"></path></svg></div>
            <div id="pwAvatar" class="profile-icon mx-auto mb-2"></div>
            <div id="pwUsername" class="font-bold text-lg mb-4"></div>
            <input type="password" id="pwInput" onkeydown="if(event.key==='Enter') confirmLogin()" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 mb-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="كلمة المرور">
            <div id="pwError" class="hidden text-red-600 text-sm mb-2">كلمة المرور غير صحيحة</div>
            <div class="flex gap-2 mt-2">
                <button onclick="closePwModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg hover:bg-gray-300">إلغاء</button>
                <button onclick="confirmLogin()" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700">دخول</button>
            </div>
        </div>
    </div>

    <!-- فوتر الدعم الفني -->
    <div class="bg-black bg-opacity-30 py-4 px-6 text-center">
        <div id="supportBox" class="flex flex-wrap items-center justify-center gap-4 text-sm text-blue-200"></div>
        <div class="text-xs text-blue-300 opacity-60 mt-2">كاشير القيصر © 2026</div>
    </div>

    <script>
        let selectedUser = null;

        function updateDateTime() {
            document.getElementById('dateTime').textContent = new Date().toLocaleString('ar');
        }
        updateDateTime();
        setInterval(updateDateTime, 30000);

        async function loadRestaurantName() {
            try {
                const r = await fetch('/api/restaurant/name');
                const d = await r.json();
                if (d.name) document.getElementById('restaurantName').textContent = d.name;
            } catch (e) {}
        }

        async function loadProfiles() {
            try {
                const r = await fetch('/api/settings/users');
                const users = await r.json();
                if (!users || users.length === 0) {
                    document.getElementById('noUsersBox').classList.remove('hidden');
                    return;
                }
                const box = document.getElementById('profilesBox');
                box.innerHTML = users.map(u => {
                const isManager = u.role === 'manager';
                const icon = isManager
                    ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0M19 7h2M20 6v2"></path></svg>'
                    : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0M4 4h16M8 4v2M16 4v2"></path></svg>';
                    const roleLabel = isManager ? 'مدير' : 'كاشير';
                    return `
                    <button onclick="openPwModal('${u.username}', '${u.role}')" class="profile-card w-full backdrop-blur p-4 flex items-center gap-4 text-right">
                        <div class="profile-icon">${icon}</div>
                        <div class="flex-1">
                            <div class="font-bold text-lg">${u.username}</div>
                        <div class="text-xs text-blue-100">${roleLabel}</div>
                        </div>
                        <svg class="q-line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M9 12h11"></path></svg>
                    </button>`;
                }).join('');
            } catch (e) {
                document.getElementById('noUsersBox').classList.remove('hidden');
            }
        }

        function openPwModal(username, role) {
            selectedUser = username;
            const icon = role === 'manager'
                ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0M19 7h2M20 6v2"></path></svg>'
                : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0M4 4h16M8 4v2M16 4v2"></path></svg>';
            document.getElementById('pwAvatar').innerHTML = icon;
            document.getElementById('pwUsername').textContent = username;
            document.getElementById('pwInput').value = '';
            document.getElementById('pwError').classList.add('hidden');
            document.getElementById('pwModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('pwInput').focus(), 100);
        }

        function closePwModal() {
            document.getElementById('pwModal').classList.add('hidden');
            selectedUser = null;
        }

        async function confirmLogin() {
            const password = document.getElementById('pwInput').value;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: selectedUser, password })
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = data.role === 'manager' ? 'settings.html' : 'index.html';
                } else {
                    document.getElementById('pwError').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('pwError').classList.remove('hidden');
            }
        }

        async function loadSupportInfo() {
            try {
                const r = await fetch('/api/settings/support-info');
                const d = await r.json();
                const box = document.getElementById('supportBox');
                const items = [];
                if (d.support_phone) items.push(`<a href="tel:${d.support_phone}" class="hover:text-white">هاتف:  ${d.support_phone}</a>`);
                if (d.whatsapp) items.push(`<a href="https://wa.me/${d.whatsapp.replace(/[^0-9]/g,'')}" target="_blank" class="hover:text-white"> واتساب</a>`);
                if (d.facebook) items.push(`<a href="${d.facebook}" target="_blank" class="hover:text-white"> فيسبوك</a>`);
                if (d.instagram) items.push(`<a href="${d.instagram}" target="_blank" class="hover:text-white"> انستغرام</a>`);
                box.innerHTML = items.length > 0 ? items.join('<span class="opacity-30">|</span>') : 'الدعم الفني';
            } catch (e) {}
        }

        loadRestaurantName();
        loadProfiles();
        loadSupportInfo();
    </script>
</body>
</html>
